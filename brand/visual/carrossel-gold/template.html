<!doctype html>
<html lang="pt-BR" data-theme="{{THEME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Carrossel Gold</title>
  <style>
    :root {
      --bg-canvas: #0B0D10;
      --surface-1: #151A21;
      --surface-2: #111C2E;
      --surface-3: #1D2732;
      --text-primary: #F4F6F8;
      --text-secondary: #93A1B2;
      --border: #2C3642;
      --accent: #F05B4C;
      --font-sans: Inter Tight, Inter, Arial, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      --font-mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    :root[data-theme="light"] {
      --bg-canvas: #F7F8FA;
      --surface-1: #FFFFFF;
      --surface-2: #EEF1F4;
      --surface-3: #E3E8ED;
      --text-primary: #11151B;
      --text-secondary: #4E5B68;
      --border: #D7DEE5;
      --accent: #C94335;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 96px;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(147, 161, 178, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(147, 161, 178, 0.035) 1px, transparent 1px),
        var(--bg-canvas);
      background-size: 114px 114px, 114px 114px, auto;
    }

    .canvas::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid var(--border);
      opacity: 0.42;
    }

    .topbar,
    .footer {
      position: absolute;
      left: 96px;
      right: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar {
      top: 72px;
      height: 32px;
      border-bottom: 1px solid var(--border);
    }

    .topbar__label {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar__label::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      background: var(--surface-3);
    }

    .topbar__meta {
      color: var(--text-secondary);
    }

    .footer {
      bottom: 72px;
      height: 32px;
      border-top: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand__mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .pagination {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
    }

    .content {
      position: absolute;
      top: 190px;
      left: 96px;
      right: 96px;
      bottom: 150px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .title {
      max-width: 800px;
      margin: 0;
      color: var(--text-primary);
      font-size: 48px;
      font-weight: 750;
      line-height: 1.05;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .lede {
      max-width: 790px;
      margin: 28px 0 0;
      color: var(--text-secondary);
      font-size: 23px;
      font-weight: 450;
      line-height: 1.38;
      letter-spacing: -0.015em;
    }

    .cover .title {
      max-width: 820px;
      font-size: 64px;
      line-height: 0.98;
    }

    .cover .lede {
      max-width: 700px;
      margin-top: 32px;
      font-size: 26px;
      line-height: 1.32;
    }

    .cover__flow {
      display: grid;
      grid-template-columns: 280px 112px 1fr;
      align-items: stretch;
      gap: 24px;
      margin-top: 88px;
      min-height: 190px;
    }

    .flow-node {
      position: relative;
      display: flex;
      min-height: 190px;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-1);
    }

    .flow-node--origin {
      border-left: 4px solid var(--accent);
      background: var(--surface-2);
    }

    .flow-node__index,
    .card__index {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
    }

    .flow-node__label,
    .card__title {
      margin: 0;
      color: var(--text-primary);
      font-size: 25px;
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: -0.02em;
    }

    .flow-node__meta,
    .card__text {
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 450;
      line-height: 1.38;
    }

    .flow-connector {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-connector::before,
    .flow-connector::after {
      content: "";
      position: absolute;
      height: 1px;
      background: var(--border);
    }

    .flow-connector::before {
      left: 0;
      right: 0;
    }

    .flow-connector::after {
      right: 0;
      width: 24px;
      height: 24px;
      border-top: 2px solid var(--border);
      border-right: 2px solid var(--border);
      background: transparent;
      transform: rotate(45deg);
      transform-origin: right center;
    }

    .callout {
      margin-top: auto;
      padding: 24px 28px;
      border-left: 2px solid var(--accent);
      background: var(--surface-1);
      color: var(--text-primary);
      font-size: 21px;
      font-weight: 550;
      line-height: 1.35;
    }

    .stack__cards,
    .interface__cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 72px;
    }

    .card {
      position: relative;
      min-height: 286px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-1);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--surface-3);
    }

    .card__index {
      display: block;
    }

    .card__title {
      margin-top: 54px;
    }

    .card__text {
      max-width: 230px;
    }

    .flow-diagram {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 72px;
      min-height: 430px;
    }

    .flow-diagram__origin {
      grid-column: 1 / 3;
      min-height: 150px;
      margin-bottom: 8px;
    }

    .flow-diagram__targets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .flow-lines {
      position: absolute;
      z-index: 0;
      inset: 126px 0 auto;
      width: 888px;
      height: 280px;
      pointer-events: none;
    }

    .flow-lines line,
    .flow-lines path {
      stroke: var(--border);
      stroke-width: 2;
      fill: none;
    }

    .flow-lines path {
      stroke-dasharray: 8 8;
    }

    .flow-diagram .flow-node {
      z-index: 1;
    }

    .flow-diagram .flow-node--origin {
      min-height: 150px;
    }

    .flow-diagram .flow-node__label {
      margin-top: 0;
    }

    .flow-diagram .flow-node__meta {
      max-width: 330px;
    }

    .interface__cards .card {
      min-height: 300px;
    }

    .interface__cards .card__title {
      margin-top: 54px;
    }

    .interface__cards .card__text {
      max-width: 240px;
    }

    .closing__callout {
      margin-top: 88px;
      padding: 32px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: var(--surface-2);
    }

    .closing__callout p {
      max-width: 760px;
      margin: 0;
      color: var(--text-primary);
      font-size: 30px;
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -0.02em;
    }

    .closing__note {
      margin-top: 30px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .closing__flow {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 72px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .closing__flow span {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface-1);
    }

    .closing__flow strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .closing__flow svg {
      width: 72px;
      height: 16px;
      overflow: visible;
    }

    .closing__flow line {
      stroke: var(--border);
      stroke-width: 2;
    }

    .closing__flow path {
      stroke: var(--border);
      stroke-width: 2;
      fill: none;
    }
  </style>
</head>
<body>
  <main class="canvas {{VARIANT}}" id="slide" aria-label="{{LABEL}}">
    <header class="topbar">
      <div class="topbar__label">{{LABEL}}</div>
      <div class="topbar__meta">{{DESCRIPTOR}}</div>
    </header>

    <section class="content" id="content"></section>

    <footer class="footer">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">{{BRAND_MARK}}</span>
        <span>{{BRAND_DESCRIPTOR}}</span>
      </div>
      <div class="pagination">{{NUMBER}} / {{TOTAL}}</div>
    </footer>
  </main>

  <script id="slide-data" type="application/json">{{DATA_JSON}}</script>
  <script>
    const data = JSON.parse(document.getElementById('slide-data').textContent);
    const content = document.getElementById('content');
    const escapeHtml = (value) => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const card = (item) => `
      <article class="card">
        <span class="card__index">${escapeHtml(item.index)}</span>
        <h3 class="card__title">${escapeHtml(item.title)}</h3>
        <p class="card__text">${escapeHtml(item.text)}</p>
      </article>`;

    const flowNode = (item, origin = false) => `
      <article class="flow-node${origin ? ' flow-node--origin' : ''}">
        <span class="flow-node__index">${escapeHtml(item.index || '01')}</span>
        <div>
          <h3 class="flow-node__label">${escapeHtml(item.label || item.target)}</h3>
          <p class="flow-node__meta">${escapeHtml(item.meta)}</p>
        </div>
      </article>`;

    const renderCover = (slide) => `
      <h1 class="title">${escapeHtml(slide.title)}</h1>
      <p class="lede">${escapeHtml(slide.lede)}</p>
      <div class="cover__flow" aria-label="Fluxo da camada Gold para o próximo consumidor">
        ${flowNode({ index: '01', label: 'Camada Gold', meta: 'dados prontos para consumo' }, true)}
        <div class="flow-connector" aria-hidden="true"></div>
        ${flowNode({ index: '02', label: 'Próximo consumidor', meta: 'humano ou agente de IA' })}
      </div>
      <aside class="callout">${escapeHtml(slide.callout)}</aside>`;

    const renderStack = (slide) => `
      <h1 class="title">${escapeHtml(slide.title)}</h1>
      <p class="lede">${escapeHtml(slide.lede)}</p>
      <div class="stack__cards">${slide.cards.map(card).join('')}</div>`;

    const renderFlow = (slide) => `
      <h1 class="title">${escapeHtml(slide.title)}</h1>
      <p class="lede">${escapeHtml(slide.lede)}</p>
      <div class="flow-diagram" aria-label="Fluxo de consumo da camada Gold">
        <svg class="flow-lines" viewBox="0 0 888 280" aria-hidden="true">
          <path d="M444 22 C444 92 330 92 222 116"></path>
          <path d="M444 22 C444 92 558 92 666 116"></path>
        </svg>
        ${flowNode({ index: '01', label: slide.flow.origin.label, meta: slide.flow.origin.meta }, true).replace('class="flow-node flow-node--origin"', 'class="flow-node flow-node--origin flow-diagram__origin"')}
        <div class="flow-diagram__targets">
          ${slide.flow.connections.map((item, index) => flowNode({ index: String(index + 2).padStart(2, '0'), target: item.target, meta: item.meta })).join('')}
        </div>
      </div>`;

    const renderInterface = (slide) => `
      <h1 class="title">${escapeHtml(slide.title)}</h1>
      <p class="lede">${escapeHtml(slide.lede)}</p>
      <div class="interface__cards">${slide.cards.map(card).join('')}</div>`;

    const renderClosing = (slide) => `
      <h1 class="title">${escapeHtml(slide.title)}</h1>
      <p class="lede">${escapeHtml(slide.lede)}</p>
      <aside class="closing__callout"><p>${escapeHtml(slide.callout)}</p></aside>
      <div class="closing__note">${escapeHtml(slide.footnote)}</div>
      <div class="closing__flow" aria-label="Relação entre Gold e consumidor">
        <span><strong>Gold</strong> · modelo + contexto</span>
        <svg viewBox="0 0 72 16" aria-hidden="true"><line x1="0" y1="8" x2="58" y2="8"></line><path d="M54 2 L66 8 L54 14"></path></svg>
        <span><strong>consumidor</strong> · interpreta o que encontra</span>
      </div>`;

    const renderers = { cover: renderCover, stack: renderStack, flow: renderFlow, interface: renderInterface, closing: renderClosing };
    content.innerHTML = renderers[data.slide.variant](data.slide);
  </script>
</body>
</html>
