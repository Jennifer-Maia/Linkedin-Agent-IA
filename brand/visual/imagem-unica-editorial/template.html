<!doctype html>
<html lang="pt-BR" data-theme="{{THEME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Imagem única editorial</title>
  <style>
    :root {
      --bg-canvas: #0B0D10;
      --surface: #11161D;
      --surface-strong: #171E27;
      --text-primary: #F4F6F8;
      --text-secondary: #9AA8B6;
      --text-faint: #687686;
      --border: #2A343F;
      --accent: #F05B4C;
      --font-sans: Inter, Arial, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      --font-mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 88px 96px 82px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(240, 91, 76, 0.08) 1px, transparent 1px),
        radial-gradient(circle at 82% 18%, rgba(240, 91, 76, 0.11), transparent 28%);
      background-position: 96px 0, 100% 0;
      background-size: 114px 100%, 520px 520px;
      background-repeat: no-repeat;
    }

    .canvas::before {
      content: "";
      position: absolute;
      top: 88px;
      bottom: 82px;
      left: 96px;
      width: 4px;
      background: var(--accent);
    }

    .canvas::after {
      content: "";
      position: absolute;
      top: 88px;
      bottom: 82px;
      left: 124px;
      width: 1px;
      background: var(--border);
      opacity: 0.7;
    }

    .masthead,
    .footer {
      position: relative;
      z-index: 1;
      margin-left: 64px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 48px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .masthead__context {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .masthead__context::before {
      content: "";
      width: 9px;
      height: 9px;
      border: 1px solid var(--accent);
      transform: rotate(45deg);
    }

    .masthead__source {
      max-width: 420px;
      text-align: right;
    }

    .statement {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin-left: 64px;
      padding: 76px 0 70px;
    }

    .statement__label {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .title {
      max-width: 790px;
      margin: 30px 0 0;
      color: var(--text-primary);
      font-size: 72px;
      font-weight: 760;
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .lede {
      max-width: 700px;
      margin: 34px 0 0;
      color: var(--text-secondary);
      font-size: 25px;
      font-weight: 450;
      line-height: 1.42;
      letter-spacing: -0.018em;
    }

    .callout-block {
      max-width: 680px;
      margin: 54px 0 0;
      padding: 24px 28px;
      border-left: 2px solid var(--accent);
      background: linear-gradient(90deg, rgba(240, 91, 76, 0.12), rgba(240, 91, 76, 0.035));
      color: var(--text-primary);
      font-size: 21px;
      font-weight: 560;
      line-height: 1.38;
      letter-spacing: -0.012em;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 48px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-secondary);
    }

    .brand__mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .footer__format {
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="{{LABEL}}">
    <header class="masthead">
      <div class="masthead__context">{{CONTEXT}}</div>
      <div class="masthead__source">{{SOURCE}}</div>
    </header>

    <section class="statement" aria-labelledby="statement-title">
      <div class="statement__label">{{LABEL}}</div>
      <h1 class="title" id="statement-title">{{TITLE}}</h1>
      <p class="lede">{{LEDE}}</p>
      {{CALLOUT_BLOCK}}
    </section>

    <footer class="footer">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">{{BRAND_MARK}}</span>
        <span>{{BRAND_DESCRIPTOR}}</span>
      </div>
      <div class="footer__format">Imagem única · {{THEME}}</div>
    </footer>
  </main>
</body>
</html>
